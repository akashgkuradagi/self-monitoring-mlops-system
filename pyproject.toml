[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self-monitoring-mlops-system"
version = "0.1.0"
description = "An Intelligent Framework for ML Model Drift Detection, Monitoring, and Automated Recovery"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Akash G Kuradagi" },
    { name = "Anantha Krishna M A" },
    { name = "Amit Prasad S G" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "mlflow>=2.15.0",
    "dvc>=3.50.0",
    "torch>=2.0.0",
    "pennylane>=0.40.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.6.0",
    "flake8>=7.0.0",
    "bandit>=1.7.0",
    "pyyaml>=6.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -m 'not soak'"
pythonpath = ["."]
markers = [
    "soak: long-running continuous availability soak tests (NFR-03, TC-18)"
]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2.5:DeprecationWarning:joblib.numpy_pickle"
]
