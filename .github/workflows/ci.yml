name: CI Pipeline (CI-01)

"on":
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test-and-lint:
    name: Lint, Security Scan & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit coverage

      - name: Code Quality & Linting (flake8)
        run: |
          flake8 app tests

      - name: Security Scan (bandit)
        run: |
          bandit -r app -ll

      - name: DVC Dataset Verification & Offline Preparation
        run: |
          # If a DVC remote and credentials are configured via GitHub secrets, pull from remote.
          # Otherwise, execute deterministic dataset generation pipeline in offline mode.
          if [ -n "${{ secrets.DVC_REMOTE_URL }}" ]; then
            echo "DVC remote configured. Attempting dvc pull..."
            dvc pull || echo "DVC remote pull skipped or unavailable."
          fi
          python scripts/prepare_datasets.py

      - name: Run Test Suite with Coverage
        run: |
          coverage run -m pytest -v
          coverage report --include="app/*"
          coverage xml --include="app/*" -o coverage.xml

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.xml
          if-no-files-found: error

      - name: Application Smoke Test Probe
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 4
          curl -f http://127.0.0.1:8000/health || exit 1
          curl -f http://127.0.0.1:8000/api/v1/metrics/summary || exit 1

      - name: Docker Compose Build Smoke Test (PKG-01)
        run: |
          docker compose build
